# Checks every push to main and every pull request. Free: public repos have
# unlimited Actions minutes, private repos 2,000 min/month on GitHub Free
# (one run takes about 4 minutes). No secrets needed — everything runs offline
# against an in-memory database, fake mail/calendar and a scripted model.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Chrome comes preinstalled on GitHub's Ubuntu runners.
      CHROME_PATH: /usr/bin/google-chrome
      JARVIS_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test
      - name: Vercel-ESM-Check (kein require() von ESM-Paketen)
        run: npm run check:esm
      - name: UI-Smoke-Test (alle Ansichten, Handy + Desktop)
        run: npm run test:ui -- --shots ui-shots
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ui-shots
          if-no-files-found: ignore
          retention-days: 7
